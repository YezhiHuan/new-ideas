[package]
name = "new-ideas"
version = "0.1.0"
description = "A desktop research idea management app"
authors = ["NEW IDEAS"]
license = ""
repository = ""
edition = "2021"

[lib]
name = "new_ideas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
dotenvy = "0.15"
